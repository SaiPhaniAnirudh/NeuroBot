name: Hugging Face Space keep-alive

on:
  schedule:
    # A free Space goes to sleep after a long idle period; one ping every 6 hours keeps it warm.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the NeuroBot Space
        run: |
          BASE_URL="${{ secrets.NEUROBOT_URL || 'https://energyvenom-neurobot.hf.space' }}"
          for attempt in 1 2 3; do
            CODE=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 90 "${BASE_URL%/}/api/health")
            echo "attempt $attempt: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 15
          done
          exit 0
